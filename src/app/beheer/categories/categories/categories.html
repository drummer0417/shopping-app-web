<body>
  <div class="page-layout">
    <header>
      <div class="container">
        <mat-icon class="add-icon" (click)="addCategory()">add_circle_outline</mat-icon>
      </div>
      <hr />
    </header>
    <main>
      <div class="items">
        <p>
          @for (category of allCategories(); track category.id) {
            <app-category-detail [category]="category" />
            <br />
          }
        </p>
      </div>
    </main>
  </div>
</body>
