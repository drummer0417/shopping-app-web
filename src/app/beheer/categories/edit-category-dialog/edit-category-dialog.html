<div class="dialog">
  <!-- <div class="dialog_bg"> -->
  <h3 class="title" mat-dialog-title>{{ data.title }}</h3>
  <mat-dialog-content class="dialog-center-content" [formGroup]="form">
    <div class="form-grid">
      <mat-form-field>
        <mat-label>Omschrijving</mat-label>
        <input matInput formControlName="description" required />
        <mat-error>Omschrijving is verplicht</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Locatie</mat-label>
        <input matInput type="number" formControlName="location" required="" />
        <mat-error>Locatie is verplicht</mat-error>
      </mat-form-field>
    </div>

    @if (errorMessage) {
      <mat-error>
        {{ errorMessage }}
      </mat-error>
    }
  </mat-dialog-content>

  <mat-dialog-actions class="triple-button-container">
    @if (data.title.startsWith('Wijzig')) {
      <div class="column-left">
        <button matMiniFab (click)="onDelete()" class="btn-delete" matTooltip="Verwijderen">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
    <div class="column-right">
      <button mat-mini-fab (click)="onCancel()" class="btn-cancel" matTooltip="Annuleren">
        <mat-icon>cancel</mat-icon>
      </button>
      <button
        matMiniFab
        color="primary"
        (click)="onSave()"
        matTooltip="Opslaan"
        [disabled]="form.invalid"
      >
        <mat-icon>save</mat-icon>
      </button>
    </div>
  </mat-dialog-actions>
</div>
