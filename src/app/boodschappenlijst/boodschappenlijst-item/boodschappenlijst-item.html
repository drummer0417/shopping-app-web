<table class="table-container">
  <tbody>
    <tr [class.picked]="article.ordered > 0">
      <td (click)="onResetProduct()">
        <strong>{{ article.ordered }}</strong>
      </td>
      <td (click)="onAddArticle()">
        <strong>{{ article.description }} </strong>
        <br />
        {{ article.shop.name }}, {{ article.brand }}, {{ article.category.description }},
        {{ article.uom }}, {{ article.dateModified.toMillis() | date: 'dd-MM-yyyy' }}
        @if (article.note) {
          <br />
          {{ article.note }}
        }
      </td>
      <td [class.aanbieding]="article.specialOffer">{{ article.price | currency: 'EUR' }}</td>
    </tr>
  </tbody>
</table>
<hr />
