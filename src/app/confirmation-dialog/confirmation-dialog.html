<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="outlined" class="cancel" [mat-dialog-close]="false">Annuleren</button>
  <button matButton="outlined" class="error-button" [mat-dialog-close]="true">Bevestigen</button>
</mat-dialog-actions>
