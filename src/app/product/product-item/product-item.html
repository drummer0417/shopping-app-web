<table class="table-container">
  <tbody>
    <tr (click)="onRowClicked()">
      <td>
        <strong>
          {{ product.omschrijving }}
        </strong>
        <br />
        {{ product.winkel.naam }}, {{ product.merk }}, {{ product.categorie.omschrijving }},
        {{ product.eenheid }}, {{ product.wijzigdatum.toMillis() | date: 'dd-MM-yyyy' }}
        @if (product.opmerking) {
          <br />
          {{ product.opmerking }}
        }
      </td>
      <td [class.aanbieding]="product.aanbieding">{{ product.prijs | currency: 'EUR' }}</td>
    </tr>
  </tbody>
</table>
<hr />
