<body>
  <div class="page-layout">
    <header>
      <form [formGroup]="form">
        <div class="input-container">
          <mat-form-field class="search" appearance="outline">
            <mat-label>Zoek product...</mat-label>
            <input matInput type="text" formControlName="searchValue" />
            @if (searchValue()) {
              <mat-icon class="close-icon" (click)="resetSearchValue()">close</mat-icon>
            }
          </mat-form-field>
          <mat-icon class="add-icon" (click)="addProduct()">add_circle_outline</mat-icon>
        </div>
      </form>
    </header>
    <main>
      <div class="items">
        <p>
          @for (product of filteredProducts(); track product.id) {
            <app-product-item [product]="product" />
          }
        </p>
      </div>
    </main>
  </div>
</body>
