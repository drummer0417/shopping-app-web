<hr />
<table class="table-container">
  <tbody>
    <tr [class.picked]="article.picked">
      <td>
        @if (article.picked) {
          <mat-icon>check</mat-icon>
        } @else {
          {{ article.ordered }}
        }
      </td>
      <td (click)="onSwapPicked()">
        <strong>
          {{ article.description }}
        </strong>
        <br />
        {{ article.shop.name }}, {{ article.brand }}, {{ article.category.description }},
        {{ article.uom }}
      </td>
      <td [class.aanbieding]="article.specialOffer">{{ article.price | currency: 'EUR' }}</td>
    </tr>
  </tbody>
</table>
