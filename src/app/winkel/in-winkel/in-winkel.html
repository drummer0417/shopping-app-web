<body>
  <div class="page-layout">
    <header>
      <div class="container">
        <p>{{ pickedArticles() }} / {{ orderedArticles().length }}</p>
        <mat-icon class="reset-icon" (click)="resetOrderedAndPicked()"
          >published_with_changes</mat-icon
        >
      </div>
      <hr />
    </header>
    <main>
      <p>
        @for (article of orderedArticles(); track article.id) {
          <app-in-winkel-item [article]="article" />
        }
      </p>
    </main>
  </div>
</body>
