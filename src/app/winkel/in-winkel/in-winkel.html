<body>
  <div class="page-layout">
    <header>
      <div class="container">
        <p>{{ pickedProducten() }} / {{ besteldeProducten().length }}</p>
        <mat-icon class="reset-icon" (click)="resetOrderedAndPicked()"
          >published_with_changes</mat-icon
        >
      </div>
      <hr />
    </header>
    <main>
      <table>
        <p>
          @for (article of besteldeProducten(); track article.id) {
            <app-in-winkel-item [article]="article" />
          }
        </p>
      </table>
      <!-- <hr /> -->
    </main>
  </div>
</body>
